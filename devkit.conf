# shellcheck shell=bash
# StartAppImage's settings for the devkit (scripts/devkit; docs/testing.md): the test session, the tours and the recorder.
TOUR_TITLE=StartAppImage
TOUR_PLUGIN_ID=io.github.bmaltais.startappimage
DEVKIT_NAME=startappimage
DEVKIT_LAYERS=(omarchy-startappimage)
# The session works on copies of the app's data, and the manifests are pointed at copies of the AppImages (below).
TOUR_SANDBOX_COPY=(.local/share/startappimage .local/share/applications)
TOUR_SANDBOX_LINK=(.local/share/icons)
# A recording proves it touched none of these.
TOUR_REAL_UNCHANGED=(.config/omarchy/shell.json .config/startappimage .local/share/startappimage Applications)

# The copied manifests and launcher entries name the AppImages by absolute path in your real home. Left like that, a change made
# in the session (a rename, hiding an app, moving it) would be written to your real files. So each AppImage a manifest names is
# copied into the sandbox (a reflink where the filesystem has them, so it costs nothing there) and the EXEC=, DESKTOP= and Exec=
# paths are pointed at the copies. ICON= is left alone: the icons are a read-only link to the real ones, and removing an app
# refuses a path outside the sandbox's home, which a rewritten path would no longer be. (HOME is still the real one here.)
devkit_sandbox() {
  local h=$1 f real copy leaks
  for f in "$h"/.local/share/startappimage/*.env; do
    [[ -f $f ]] || continue
    real=$(sed -n 's/^EXEC=//p' "$f" | head -n1)
    [[ $real == "$HOME"/* && -f $real ]] || continue
    copy=$h/${real#"$HOME"/}
    mkdir -p "$(dirname "$copy")"
    [[ -e $copy ]] || cp --reflink=auto "$real" "$copy"
  done
  for f in "$h"/.local/share/startappimage/*.env; do
    [[ -f $f ]] && sed -i "s#^\(EXEC\|DESKTOP\)=$HOME/#\1=$h/#" "$f"
  done
  for f in "$h"/.local/share/applications/*.desktop; do
    [[ -f $f ]] && sed -i "s#^Exec=\(\"\?\)$HOME/#Exec=\1$h/#" "$f"
  done
  # A change that still points at your real files must stop the session, not slip through.
  leaks=$(grep -lE "^(EXEC|DESKTOP)=$HOME/" "$h"/.local/share/startappimage/*.env 2>/dev/null || true)
  [[ -z $leaks ]] || { echo "nested: a sandbox manifest still names a real file: $leaks" >&2; return 1; }
}

DEVKIT_USAGE='  dev open | setup | settings APP_ID | close      open or close a window of the plugin there'
dev_cmd_open() { nenv omarchy-shell -q "$ID" close 2>/dev/null || true; sleep 0.4; dev_window open "$ID" open; }
dev_cmd_setup() { dev_window setup "$ID" setup; }
dev_cmd_settings() { dev_window settings "$ID" settings "${1:?settings needs an app id}"; }
dev_cmd_close() { nenv omarchy-shell "$ID" close >/dev/null; echo "dev close: closed"; }

# `reload` (the kit's, via scripts/reload): the plugin is installed as a git clone, so the branch has to be pushed first.
reload_open() {
  case $1 in
    open) omarchy-shell -q "$ID" close || true; sleep 0.4; omarchy-shell "$ID" open >/dev/null ;;
    setup) omarchy-shell "$ID" setup >/dev/null ;;
    settings) [[ -n ${2:-} ]] || die "settings needs an app id"; omarchy-shell "$ID" settings "$2" >/dev/null ;;
    *) die "unknown window $1 (open | setup | settings APP_ID)" ;;
  esac
}

# `check` (scripts/check.sh) runs this after its own steps.
# Icons in QML are private-use glyphs, and writing a file through a tool that drops them leaves an empty string where the
# icon was (it happened twice). An empty icon is never intended, so an empty `iconText` fails.
icons() {
  local hits
  hits=$(grep -nE 'iconText: *""' ./*.qml || true)
  [[ -z $hits ]] || { echo "empty iconText (an icon lost its glyph; write icons as \\uXXXX escapes):"; echo "$hits"; return 1; }
}
devkit_check() {
  step "CLI behaviour (tests/cli.sh)" tests/cli.sh
  step "QML icons (no empty iconText)" icons
}
